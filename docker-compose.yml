# Usage: copy .env.example to .env, set GEMINI_API_KEY, then docker compose up --build.
# Gemini calls use Google's free tier where available; local embeddings use CPU.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      MOCK_LLM: ${MOCK_LLM:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
      SCORE_THRESHOLD: ${SCORE_THRESHOLD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - documind-data:/data
      - ./eval/results:/app/eval/results:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - documind-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["rq", "worker", "documind-ingestion", "--url", "redis://redis:6379/0"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-gemini-3.5-flash-lite}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      MOCK_LLM: ${MOCK_LLM:-false}
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      CHUNK_SIZE: ${CHUNK_SIZE:-800}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-5}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-hybrid}
    volumes:
      - documind-data:/data
      - ./eval/results:/app/eval/results:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  documind-data:
  documind-redis:
