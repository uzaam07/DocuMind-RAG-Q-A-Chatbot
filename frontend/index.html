<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocuMind</title>
    <meta name="description" content="A refined document intelligence workspace for evidence-led answers." />
    <meta name="theme-color" content="#0b1017" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('documind.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else theme = 'dark';
        } catch (e) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#edf2f6' : '#0b1017');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
